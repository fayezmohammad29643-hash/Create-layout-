name: Build Ayah Mapping SQLite

on:
  workflow_dispatch:
  push:
    paths:
      - 'config-ayah-mapping.json'
      - 'input/hafs/quran.sqlite'
      - 'input/warsh/quran.sqlite'
      - 'input/qalun/quran.sqlite'
      - 'input/douri/quran.sqlite'
      - 'scripts/build_ayah_mapping_sqlite.py'
      - 'scripts/check_ayah_mapping_sqlite.py'
      - 'requirements.txt'
      - '.github/workflows/build-ayah-mapping.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install mapping dependencies
        run: python -m pip install -r requirements.txt

      - name: Build single SQLite mapping
        run: |
          set -euo pipefail
          rm -rf output/ayah_mapping
          mkdir -p output/ayah_mapping
          python scripts/build_ayah_mapping_sqlite.py \
            --project-root . \
            --output output/ayah_mapping/ayah_mapping.sqlite \
            --report output/ayah_mapping/ayah_mapping-build-report.json

      - name: Validate SQLite mapping
        run: |
          set -euo pipefail
          python scripts/check_ayah_mapping_sqlite.py \
            --db output/ayah_mapping/ayah_mapping.sqlite

      - name: Commit generated runtime database and report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ayah_mapping/ayah_mapping.sqlite output/ayah_mapping/ayah_mapping-build-report.json
          git diff --cached --quiet || git commit -m "Generate unified ayah mapping SQLite"
          git push
