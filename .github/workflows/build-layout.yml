name: Build Qalun Quran Layouts

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/mushaf.docx'
      - 'scripts/**'
      - 'config.json'
      - '.github/workflows/build-layout.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build layout directly from DOCX
        run: |
          rm -rf output/qalun
          mkdir -p output/qalun
          python scripts/build_layout.py \
            --docx input/mushaf.docx \
            --config config.json \
            --output-dir output/qalun

      - name: Verify generated output structure and samples
        shell: bash
        run: |
          set -euo pipefail
          test -s output/qalun/manifest.json
          test -d output/qalun/pages
          test -d output/qalun/surahs

          page_count="$(find output/qalun/pages -maxdepth 1 -type f -name 'page_*.json' | wc -l)"
          surah_count="$(find output/qalun/surahs -maxdepth 1 -type f -name '*.json' | wc -l)"

          test "$page_count" -eq 604
          test "$surah_count" -eq 114

          test -s output/qalun/pages/page_001.json
          test -s output/qalun/pages/page_598.json
          test -s output/qalun/pages/page_604.json
          test -s output/qalun/surahs/001.json
          test -s output/qalun/surahs/097.json
          test -s output/qalun/surahs/114.json

          echo "Generated $page_count page JSON files and $surah_count surah JSON files."
          echo "Sample page files:"
          ls -lh output/qalun/pages/page_001.json output/qalun/pages/page_598.json output/qalun/pages/page_604.json
          echo "Sample surah files:"
          ls -lh output/qalun/surahs/001.json output/qalun/surahs/097.json output/qalun/surahs/114.json

      - name: Validate generated JSON contents
        run: python scripts/check_layout.py --output-dir output/qalun

      - name: Commit all generated layout files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/qalun/
          git diff --cached --quiet || git commit -m "Generate Qalun DOCX Quran layout JSON files"
          git push
