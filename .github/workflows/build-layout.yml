name: Build Quran Layouts

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/mushaf.docx'
      - 'scripts/**'
      - 'config.json'
      - '.github/workflows/build-layout.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Brotli support
        run: python -m pip install --disable-pip-version-check Brotli

      - name: Build all surah layouts
        run: |
          python scripts/build_layout.py \
            --docx input/mushaf.docx \
            --config config.json \
            --output-dir output

      - name: Validate generated layouts
        run: python scripts/check_layout.py --output-dir output

      - name: Commit generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.json
          git diff --cached --quiet || git commit -m "Generate Quran layout JSON files"
          git push
