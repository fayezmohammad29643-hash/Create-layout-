name: Build Qalun Quran Layouts

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/qalun/UthmanicQaloon1 Ver05.doc'
      - 'input/qalun/quran.sqlite'
      - 'scripts/build_doc_layout.py'
      - 'scripts/check_doc_layout.py'
      - 'scripts/build_layout.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/build-layout.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify sources
        run: |
          set -euo pipefail
          test -s 'input/qalun/UthmanicQaloon1 Ver05.doc'
          test -s input/qalun/quran.sqlite

      - name: Build Qalun layout from DOC + SQLite
        run: |
          rm -rf output/qalun
          mkdir -p output/qalun
          python scripts/build_doc_layout.py \
            --doc 'input/qalun/UthmanicQaloon1 Ver05.doc' \
            --sqlite input/qalun/quran.sqlite \
            --config config.json \
            --output-dir output/qalun

      - name: Validate Qalun output
        run: |
          python scripts/check_doc_layout.py \
            --output-dir output/qalun \
            --sqlite input/qalun/quran.sqlite \
            --doc 'input/qalun/UthmanicQaloon1 Ver05.doc'

      - name: Verify generated output
        run: |
          set -euo pipefail
          test -s output/qalun/manifest.json
          test "$(find output/qalun/pages -maxdepth 1 -type f -name 'page_*.json' | wc -l)" -eq 604
          test "$(find output/qalun/surahs -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 114

      - name: Commit generated layouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/qalun/
          git diff --cached --quiet || git commit -m "Generate Qalun DOC+SQLite Quran layout JSON files"
          git push
