name: Build Warsh Quran Layouts

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/warsh/mushaf.pdf'
      - 'input/warsh/quran.sqlite'
      - 'scripts/pdf_layout.py'
      - 'scripts/build_pdf_layout.py'
      - 'scripts/check_pdf_layout.py'
      - 'config-warsh.json'
      - 'requirements.txt'
      - '.github/workflows/build-warsh.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify sources
        run: |
          set -euo pipefail
          test -s input/warsh/mushaf.pdf
          test -s input/warsh/quran.sqlite

      - name: Build Warsh layout from PDF + SQLite
        run: |
          rm -rf output/warsh
          mkdir -p output/warsh
          python scripts/build_pdf_layout.py \
            --pdf input/warsh/mushaf.pdf \
            --sqlite input/warsh/quran.sqlite \
            --config config-warsh.json \
            --output-dir output/warsh

      - name: Validate Warsh output
        run: |
          python scripts/check_pdf_layout.py \
            --output-dir output/warsh \
            --sqlite input/warsh/quran.sqlite

      - name: Verify generated output
        run: |
          set -euo pipefail
          test -s output/warsh/manifest.json
          test -s output/warsh/review.json
          test "$(find output/warsh/pages -maxdepth 1 -type f -name 'page_*.json' | wc -l)" -eq 604
          test "$(find output/warsh/surahs -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 114

      - name: Commit generated layouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/warsh/
          git diff --cached --quiet || git commit -m "Generate Warsh Quran layout JSON files"
          git push
